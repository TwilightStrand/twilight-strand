apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilight-strand
  namespace: twilight-strand
spec:
  replicas: 2
  selector:
    matchLabels:
      app: twilight-strand
  template:
    metadata:
      labels:
        app: twilight-strand
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: ghcr.io/OWNER/pobalternative:main
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secret
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_URL
              value: https://twilightstrand.gg
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: twilight-strand
  namespace: twilight-strand
spec:
  selector:
    app: twilight-strand
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twilight-strand
  namespace: twilight-strand
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - twilightstrand.gg
      secretName: twilight-strand-tls
  rules:
    - host: twilightstrand.gg
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twilight-strand
                port:
                  number: 80
