[package]
name = "tsc-engine"
version = "0.1.0"
edition = "2024"
description = "Twilight Strand Collective - PoE build calculation engine (WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.120"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }
bitflags = "2"

[dev-dependencies]
serde_json = "1"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
