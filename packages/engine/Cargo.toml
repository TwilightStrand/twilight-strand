[package]
name = "tsc-engine"
version = "0.1.0"
edition = "2024"
description = "Twilight Strand Collective - PoE build calculation engine (WASM)"

[lib]
# wasm-pack adds cdylib automatically; rlib-only here so `cargo test` works
crate-type = ["rlib"]

[dependencies]
wasm-bindgen = "0.2.120"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }
bitflags = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
