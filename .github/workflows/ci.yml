name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd packages/pob-codec && pnpm build
      - run: cd packages/build-codec && pnpm build
      - run: cd apps/web && npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd packages/pob-codec && pnpm build
      - run: cd packages/build-codec && pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: cd packages/pob-codec && pnpm build
      - run: cd packages/build-codec && pnpm build
      - run: bash packages/pob-data/fetch-pob.sh
      - run: node apps/web/scripts/e2e-test.mjs

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd packages/pob-codec && pnpm build
      - run: cd packages/build-codec && pnpm build
      - run: node apps/web/scripts/convert-tree-lua.mjs 3_29
      - run: cd apps/web && pnpm build
